name: Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Decode and validate signing keystore
        env:
          KANZI_KEYSTORE_BASE64: ${{ secrets.KANZI_KEYSTORE_BASE64 }}
          KANZI_KEYSTORE_PASSWORD: ${{ secrets.KANZI_KEYSTORE_PASSWORD }}
          KANZI_KEY_ALIAS: ${{ secrets.KANZI_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KANZI_KEYSTORE_BASE64" || { echo "ERROR: KANZI_KEYSTORE_BASE64 is empty or unavailable"; exit 1; }
          test -n "$KANZI_KEYSTORE_PASSWORD" || { echo "ERROR: KANZI_KEYSTORE_PASSWORD is empty or unavailable"; exit 1; }
          test -n "$KANZI_KEY_ALIAS" || { echo "ERROR: KANZI_KEY_ALIAS is empty or unavailable"; exit 1; }
          printf '%s' "$KANZI_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kanzi-signing.jks"
          test -s "$RUNNER_TEMP/kanzi-signing.jks" || { echo "ERROR: decoded keystore is empty"; exit 1; }
          keytool -list -keystore "$RUNNER_TEMP/kanzi-signing.jks" -storepass "$KANZI_KEYSTORE_PASSWORD" -alias "$KANZI_KEY_ALIAS" >/dev/null
          echo "Keystore format, password, and alias validation passed."
      - name: Sign APK with repository key
        env:
          KANZI_KEYSTORE_PASSWORD: ${{ secrets.KANZI_KEYSTORE_PASSWORD }}
          KANZI_KEY_PASSWORD: ${{ secrets.KANZI_KEY_PASSWORD }}
          KANZI_KEY_ALIAS: ${{ secrets.KANZI_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER" || { echo "ERROR: apksigner not found in Android SDK build-tools"; exit 1; }
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/kanzi-signing.jks" \
            --ks-key-alias "$KANZI_KEY_ALIAS" \
            --ks-pass env:KANZI_KEYSTORE_PASSWORD \
            --key-pass env:KANZI_KEY_PASSWORD \
            --out app/build/outputs/apk/debug/app-debug-signed.apk \
            "$APK"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug-signed.apk
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kanzi-assistant-signed-apk
          path: app/build/outputs/apk/debug/app-debug-signed.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish public test download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build-${{ github.run_number }}
          name: 看字助手测试版 ${{ github.run_number }}
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug-signed.apk
